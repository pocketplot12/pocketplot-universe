<script>
(function() {
  const STORAGE_KEY = 'pocketplot-theme';
  const THEMES = ['warm-dark', 'warm-light'];
  const DEFAULT_THEME = 'warm-light';
  try {
    let theme = localStorage.getItem(STORAGE_KEY);
    if (!theme || !THEMES.includes(theme)) {
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      theme = DEFAULT_THEME;
      localStorage.setItem(STORAGE_KEY, theme);
    }
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.classList.add('theme-' + theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', DEFAULT_THEME);
  }
})();
</script>

<script>
window.pocketplot = window.pocketplot || {};
window.pocketplot.setTheme = function(theme) {
  if (!['warm-dark', 'warm-light'].includes(theme)) theme = 'warm-dark';
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('pocketplot-theme', theme); } catch (e) {}
  return theme;
};
window.pocketplot.toggleTheme = function() {
  var cur = document.documentElement.getAttribute('data-theme');
  window.pocketplot.setTheme(cur === 'warm-light' ? 'warm-dark' : 'warm-light');
};
document.getElementById('theme-toggle-btn').addEventListener('click', function() {
  window.pocketplot.toggleTheme();
});
(function() {
  var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReducedMotion) {
    document.querySelectorAll('.reveal').forEach(function(el) { el.classList.add('visible'); });
    return;
  }
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    document.querySelectorAll('.reveal').forEach(function(el) { observer.observe(el); });
  } else {
    document.querySelectorAll('.reveal').forEach(function(el) { el.classList.add('visible'); });
  }
})();
</script>
